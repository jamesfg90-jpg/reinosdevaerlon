<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Idle RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-zinc-50">
  <noscript>Activa JavaScript para probar el RPG.</noscript>
  <div id="root" class="min-h-screen"></div>
  <div id="loader-error" class="hidden whitespace-pre-wrap p-4 text-sm text-red-700"></div>

  <script>
    async function bootIdleRpgDemo() {
      const errorBox = document.getElementById("loader-error");
      try {
        if (!window.React || !window.ReactDOM || !window.Babel) {
          throw new Error("No se pudieron cargar React, ReactDOM o Babel desde el CDN.");
        }

        const response = await fetch("./IdleRPG.tsx", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`No se pudo leer IdleRPG.tsx (${response.status}). Ejecuta esta demo desde un servidor local.`);
        }

        const source = await response.text();
        const demoSource = source
          .replace(/import React, \{ useEffect, useMemo, useState \} from "react";\n/, "const { useEffect, useMemo, useState } = React;\n")
          .replace(/export default function IdleRPG\(/, "function IdleRPG(")
          .concat("\nReactDOM.createRoot(document.getElementById('root')).render(<IdleRPG />);\n");

        const transformed = Babel.transform(demoSource, {
          filename: "IdleRPG.tsx",
          presets: ["typescript", ["react", { runtime: "classic" }]],
        }).code;

        const run = new Function("React", "ReactDOM", transformed);
        run(window.React, window.ReactDOM);
      } catch (error) {
        console.error(error);
        errorBox.classList.remove("hidden");
        errorBox.textContent = error instanceof Error ? error.message : String(error);
      }
    }

    bootIdleRpgDemo();
  </script>
</body>
</html>
